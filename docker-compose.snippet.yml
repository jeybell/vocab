# compose로 운영할 경우를 위한 참고용 예시입니다.
# 현재 서버는 docker build / docker run 방식으로 운영 중입니다 (README의 배포 항목 참고).
# 사용하려면 이 파일을 저장소 루트에 docker-compose.yml 로 두고 실행하세요.
services:
  # 브라우저 접속용 (정적 웹)
  vocab-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: vocab-web
    restart: unless-stopped
    ports:
      - "8082:80"

  # Expo Go 접속용 (개발 서버)
  vocab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocab-app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Expo Go에 알려줄 주소. 서버의 공인 IP로 바꿔서 사용하세요.
      # 지정하지 않으면 컨테이너 내부 IP를 알려주어 접속되지 않습니다.
      REACT_NATIVE_PACKAGER_HOSTNAME: "<서버-IP>"
