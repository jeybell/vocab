# compose로 운영할 경우를 위한 참고용 예시입니다.
# 현재 서버는 docker build / docker run 방식으로 운영 중입니다 (README의 "서버 배포" 참고).
# 사용하려면 이 파일을 저장소 루트에 docker-compose.yml 로 두고 실행하세요.
services:
  vocab-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocab-app
    restart: unless-stopped
    # expo start --tunnel 로 외부 접속하므로 호스트 포트 퍼블리시는 필요하지 않습니다.
    # 같은 네트워크에서 직접 붙고 싶을 때만 아래 주석을 해제하세요.
    # ports:
    #   - "8081:8081"
